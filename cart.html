<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart — Nova</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b; --text: #fafafa; --muted: #a1a1aa; --accent: #8b5cf6; --card: #111113; --border: #27272a; --hover: #18181b;
      --header-bg: rgba(9,9,11,.72); --glow: rgba(139,92,246,.22); --glow-strong: rgba(139,92,246,.18);
      --btn-bg: #fafafa; --btn-text: #09090b; --btn-hover: #e4e4e7; --ok: #4ade80;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff; --text: #09090b; --muted: #71717a; --accent: #7c3aed; --card: #fafafa; --border: #e4e4e7; --hover: #f4f4f5;
      --header-bg: rgba(255,255,255,.75); --glow: rgba(124,58,237,.16); --glow-strong: rgba(124,58,237,.16);
      --btn-bg: #18181b; --btn-text: #fafafa; --btn-hover: #3f3f46; --ok: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased;
           background-image: radial-gradient(ellipse 80% 50% at 50% -10%, var(--glow), transparent); background-repeat: no-repeat; min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; }
    a { color: inherit; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
    [data-lucide], .lucide { width: 18px; height: 18px; stroke-width: 2; flex-shrink: 0; }
    html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
      transition: background-color .5s ease, color .5s ease, border-color .5s ease, box-shadow .5s ease, fill .5s ease, stroke .5s ease !important;
    }
    header { border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; gap: 12px; }
    .logo { font-size: 1.15rem; font-weight: 700; text-decoration: none; letter-spacing: -.02em; display: inline-flex; align-items: center; }
    .logo::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 3px; background: linear-gradient(135deg, #a78bfa, #22d3ee); margin-right: 8px; }
    nav ul { list-style: none; display: flex; gap: 4px; font-size: 0.9rem; }
    nav ul a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; transition: color .2s ease, background .2s ease; }
    nav ul a:hover { color: var(--text); background: var(--hover); }
    .nav-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
                background: transparent; color: var(--text); cursor: pointer; text-decoration: none; transition: background .2s ease, transform .2s ease; }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn:active { transform: scale(.94); }
    .theme-toggle .ico-sun, .theme-toggle .ico-moon { position: absolute; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s ease; }
    html[data-theme="dark"] .theme-toggle .ico-sun { transform: rotate(0) scale(1); opacity: 1; }
    html[data-theme="dark"] .theme-toggle .ico-moon { transform: rotate(-90deg) scale(.3); opacity: 0; }
    html[data-theme="light"] .theme-toggle .ico-sun { transform: rotate(90deg) scale(.3); opacity: 0; }
    html[data-theme="light"] .theme-toggle .ico-moon { transform: rotate(0) scale(1); opacity: 1; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--btn-bg); color: var(--btn-text); padding: 11px 22px; border-radius: 10px; border: 0; cursor: pointer;
           text-decoration: none; font-family: inherit; font-weight: 600; font-size: .95rem; transition: transform .2s ease, background .2s ease, box-shadow .2s ease; box-shadow: 0 8px 24px var(--glow); }
    .btn:hover { transform: translateY(-1px); background: var(--btn-hover); box-shadow: 0 12px 32px var(--glow-strong); }
    section { padding: 64px 0; }
    h2 { font-size: 2rem; letter-spacing: -.03em; margin-bottom: 32px; text-align: center; }
    .cart { max-width: 640px; margin: 0 auto; }
    .row { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; transition: border-color .25s ease; }
    .row:hover { border-color: var(--accent); }
    .row .info { flex: 1; }
    .row .info strong { font-size: 1.05rem; display: block; }
    .row .info span { color: var(--muted); font-size: .9rem; }
    .qty { display: inline-flex; align-items: center; gap: 10px; }
    .qty button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--hover); color: var(--text); cursor: pointer; font-size: 1rem; }
    .qty button:hover { border-color: var(--accent); }
    .line { font-weight: 700; min-width: 72px; text-align: right; }
    .remove { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1.3rem; line-height: 1; padding: 4px 6px; border-radius: 8px; }
    .remove:hover { color: var(--text); background: var(--hover); }
    .total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; padding: 16px 4px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
    .link { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .link:hover { color: var(--text); }
    .empty { text-align: center; color: var(--muted); }
    .empty .big { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--border); color: var(--accent); }
    .empty .big .lucide { width: 28px; height: 28px; }
    .empty .btn { margin-top: 20px; }
    .msg { text-align: center; color: var(--ok); font-size: 1.1rem; }
    .msg .big { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--ok); }
    .msg .big .lucide { width: 28px; height: 28px; }
    footer { border-top: 1px solid var(--border); padding: 28px 0; text-align: center; color: var(--muted); font-size: 0.85rem; }
    @media (max-width: 600px) { nav ul { display: none; } .row { flex-wrap: wrap; } section { padding: 40px 0; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <a href="index.html" class="logo">Nova</a>
        <ul>
          <li><a href="index.html#features">Features</a></li>
          <li><a href="index.html#menu">Products</a></li>
          <li><a href="index.html#reviews">Reviews</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <button type="button" class="icon-btn theme-toggle" id="themeToggle" aria-label="Switch between light and dark theme">
            <i data-lucide="sun" class="ico-sun"></i><i data-lucide="moon" class="ico-moon"></i>
          </button>
          <a href="index.html" class="icon-btn" aria-label="Home"><i data-lucide="house"></i></a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="wrap">
        <h2>Your Cart</h2>
        <div class="cart" id="cart"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><p>Support available 24/7 · hello@nova.example · © 2026 Nova</p></div>
  </footer>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    function icons() { if (window.lucide) lucide.createIcons(); }
    var root = document.documentElement;
    document.getElementById("themeToggle").addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
      root.classList.add("theme-anim");
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      setTimeout(function () { root.classList.remove("theme-anim"); }, 600);
    });

    var box = document.getElementById("cart");
    function getCart() { try { return JSON.parse(localStorage.getItem("cart")) || []; } catch (e) { return []; } }
    function saveCart(c) { try { localStorage.setItem("cart", JSON.stringify(c)); } catch (e) {} render(); }
    function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function render() {
      var cart = getCart();
      if (!cart.length) {
        box.innerHTML = '<div class="empty"><div class="big"><i data-lucide="shopping-bag"></i></div><p>Your cart is empty.</p><a class="btn" href="index.html#menu">Browse products<i data-lucide="arrow-right"></i></a></div>';
        icons();
        return;
      }
      var total = 0;
      var html = cart.map(function (i, idx) {
        total += i.price * i.qty;
        return '<div class="row"><div class="info"><strong>' + esc(i.name) + '</strong><span>₹' + i.price + ' each</span></div>' +
          '<span class="qty"><button data-a="minus" data-i="' + idx + '" aria-label="Decrease">−</button><span>' + i.qty +
          '</span><button data-a="plus" data-i="' + idx + '" aria-label="Increase">+</button></span>' +
          '<span class="line">₹' + (i.price * i.qty) + '</span>' +
          '<button class="remove" data-a="remove" data-i="' + idx + '" aria-label="Remove">&times;</button></div>';
      }).join("");
      html += '<div class="total"><span>Total</span><span>₹' + total + '</span></div>' +
        '<div class="actions"><a class="link" href="index.html#menu"><i data-lucide="arrow-left"></i>Continue shopping</a>' +
        '<button class="btn" data-a="checkout"><i data-lucide="lock"></i>Place order</button></div>';
      box.innerHTML = html;
      icons();
    }
    box.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-a]");
      if (!b) return;
      var cart = getCart(), i = parseInt(b.getAttribute("data-i"), 10), a = b.getAttribute("data-a");
      if (a === "plus" && cart[i]) cart[i].qty = Math.min(20, cart[i].qty + 1);
      else if (a === "minus" && cart[i]) { cart[i].qty -= 1; if (cart[i].qty < 1) cart.splice(i, 1); }
      else if (a === "remove") cart.splice(i, 1);
      else if (a === "checkout") {
        saveCart([]);
        box.innerHTML = '<div class="msg"><div class="big"><i data-lucide="check"></i></div><p>Thank you! Your order has been placed.</p><p style="margin-top:20px"><a class="btn" href="index.html">Back to home</a></p></div>';
        icons();
        return;
      }
      saveCart(cart);
    });
    icons();
    render();
  </script>
</body>
</html>
