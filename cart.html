<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart — Brew & Bean</title>
  <style>
    :root { --bg: #faf7f2; --text: #2b2118; --muted: #6f6257; --accent: #b5652b; --card: #ffffff; --border: #e8e0d5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: inherit; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
    header { border-bottom: 1px solid var(--border); }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
    .logo { font-size: 1.4rem; font-weight: bold; text-decoration: none; }
    nav ul { list-style: none; display: flex; gap: 24px; font-family: system-ui, sans-serif; font-size: 0.95rem; }
    nav ul a { text-decoration: none; color: var(--muted); }
    .btn { display: inline-block; background: #1f4d2e; color: #fff; padding: 14px 28px; border-radius: 999px; border: 0; cursor: pointer;
           text-decoration: none; font-family: system-ui, sans-serif; font-weight: 600; font-size: 1rem; }
    section { padding: 64px 0; }
    h2 { font-size: 2rem; margin-bottom: 32px; text-align: center; }
    .cart { max-width: 640px; margin: 0 auto; font-family: system-ui, sans-serif; }
    .row { display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; margin-bottom: 12px; }
    .row .info { flex: 1; }
    .row .info strong { font-family: Georgia, serif; font-size: 1.1rem; display: block; }
    .row .info span { color: var(--muted); font-size: .9rem; }
    .qty { display: inline-flex; align-items: center; gap: 10px; }
    .qty button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 1rem; }
    .line { font-weight: 700; color: var(--accent); min-width: 64px; text-align: right; }
    .remove { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1.3rem; }
    .total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; padding: 16px 4px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
    .link { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); }
    .empty .btn { margin-top: 20px; }
    .msg { text-align: center; color: #1f4d2e; font-size: 1.1rem; }
    footer { border-top: 1px solid var(--border); padding: 32px 0; text-align: center; color: var(--muted); font-family: system-ui, sans-serif; font-size: 0.9rem; }
    @media (max-width: 600px) { nav ul { gap: 14px; font-size: 0.85rem; } .row { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <a href="index.html" class="logo">Brew & Bean</a>
        <ul>
          <li><a href="index.html#menu">Menu</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="wrap">
        <h2>Your Cart</h2>
        <div class="cart" id="cart"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><p>Open daily 8 AM – 9 PM · hello@brewandbean.example · © 2026 Brew & Bean</p></div>
  </footer>

  <script>
    var box = document.getElementById("cart");
    function getCart() { try { return JSON.parse(localStorage.getItem("cart")) || []; } catch (e) { return []; } }
    function saveCart(c) { try { localStorage.setItem("cart", JSON.stringify(c)); } catch (e) {} render(); }
    function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function render() {
      var cart = getCart();
      if (!cart.length) {
        box.innerHTML = '<div class="empty"><p>Your cart is empty.</p><a class="btn" href="index.html#menu">Browse the menu</a></div>';
        return;
      }
      var total = 0;
      var html = cart.map(function (i, idx) {
        total += i.price * i.qty;
        return '<div class="row"><div class="info"><strong>' + esc(i.name) + '</strong><span>₹' + i.price + ' each</span></div>' +
          '<span class="qty"><button data-a="minus" data-i="' + idx + '" aria-label="Decrease">−</button><span>' + i.qty +
          '</span><button data-a="plus" data-i="' + idx + '" aria-label="Increase">+</button></span>' +
          '<span class="line">₹' + (i.price * i.qty) + '</span>' +
          '<button class="remove" data-a="remove" data-i="' + idx + '" aria-label="Remove">&times;</button></div>';
      }).join("");
      html += '<div class="total"><span>Total</span><span>₹' + total + '</span></div>' +
        '<div class="actions"><a class="link" href="index.html#menu">← Continue shopping</a>' +
        '<button class="btn" data-a="checkout">Place order</button></div>';
      box.innerHTML = html;
    }
    box.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-a]");
      if (!b) return;
      var cart = getCart(), i = parseInt(b.getAttribute("data-i"), 10), a = b.getAttribute("data-a");
      if (a === "plus" && cart[i]) cart[i].qty = Math.min(20, cart[i].qty + 1);
      else if (a === "minus" && cart[i]) { cart[i].qty -= 1; if (cart[i].qty < 1) cart.splice(i, 1); }
      else if (a === "remove") cart.splice(i, 1);
      else if (a === "checkout") {
        saveCart([]);
        box.innerHTML = '<div class="msg"><p>Thank you! Your order has been placed ☕</p><p style="margin-top:20px"><a class="btn" href="index.html">Back to home</a></p></div>';
        return;
      }
      saveCart(cart);
    });
    render();
  </script>
</body>
</html>
